name: CI

on:
  push:
    # feature/** so a pushed feature branch is checked without opening a pull request
    branches: [main, "feature/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Source Code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: Source Code/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: "Migrations on an empty SQLite database (twice, then schema check)"
        env:
          DISABLE_MQTT: "true"
          DATABASE_URL: sqlite:///./ci_migration_check.db
        run: |
          python -m alembic upgrade head
          python -m alembic upgrade head
          python schema_check.py
      - name: "Tests (run serially: the suite shares one SQLite file)"
        env:
          DISABLE_MQTT: "true"
          # the suite fails if it is not actually running on this database type
          EXPECT_DB_DIALECT: sqlite
        run: pytest -q

  backend-postgres:
    # Same backend, but the database is a real PostgreSQL 16 service.
    runs-on: ubuntu-latest
    # a blocked drop_all/create_all would otherwise hang for hours
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Source Code/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: access_control_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d access_control_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DISABLE_MQTT: "true"
      DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/access_control_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: Source Code/backend/requirements-postgres.txt
      - run: pip install -r requirements-postgres.txt
      - name: "Migrations on an empty PostgreSQL database (twice, then schema check)"
        run: |
          python -m alembic upgrade head
          python -m alembic upgrade head
          python schema_check.py
          python -m alembic current
      - name: "Tests against PostgreSQL"
        # continue-on-error until this job has been seen to pass once on GitHub:
        # it has never been executed, so a first failure should be read, not hidden.
        # Remove this line once it is green.
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://ci:ci@localhost:5432/access_control_ci
          # the suite fails if it silently falls back to SQLite
          EXPECT_DB_DIALECT: postgresql
        run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Source Code/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Source Code/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Syntax check
        run: python -m compileall -q "Source Code/gateway"
