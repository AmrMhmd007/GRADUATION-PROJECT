name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Source Code/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: Source Code/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: "Tests (run serially: the suite shares one SQLite file)"
        env:
          DISABLE_MQTT: "true"
        run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Source Code/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Source Code/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Syntax check
        run: python -m compileall -q "Source Code/gateway"
